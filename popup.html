<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { --green:#2ca01c; --blue:#13b5ea; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    width: 320px; margin: 0; padding: 16px; color: #1a1a1a;
  }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { font-size: 11px; color: #777; margin: 0 0 16px; }

  .card { border: 1px solid #e3e3e3; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .card.qbo .name::before { background: var(--green); }
  .card.xero .name::before { background: var(--blue); }
  .head { display:flex; align-items:center; justify-content:space-between; }
  .name { font-size: 13px; font-weight: 600; display:flex; align-items:center; }
  .name::before {
    content:""; display:inline-block; width:8px; height:8px;
    border-radius:50%; margin-right:7px;
  }
  .strategy { font-size: 10px; color:#888; margin: 3px 0 10px; line-height:1.4; }

  .row { display:flex; align-items:center; justify-content:space-between; margin-top:9px; }
  .row label { font-size: 12px; color:#333; }
  select { font-size: 12px; padding: 3px 6px; }

  /* Must be a <label> (not a <span>) so clicking the visible slider actually
     toggles the visually-hidden checkbox underneath it. */
  .switch { position: relative; display:inline-block; width: 38px; height: 21px; flex:none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position:absolute; inset:0; cursor:pointer; background:#ccc; border-radius:21px; transition:.2s; }
  .slider:before {
    content:""; position:absolute; height:15px; width:15px; left:3px; bottom:3px;
    background:#fff; border-radius:50%; transition:.2s;
  }
  .qbo input:checked + .slider { background: var(--green); }
  .xero input:checked + .slider { background: var(--blue); }
  input:checked + .slider:before { transform: translateX(17px); }

  .ceiling { font-size:10px; color:#999; margin-top:6px; line-height:1.4; }
  .check { display:flex; align-items:flex-start; gap:6px; margin-top:9px; font-size:11px; color:#333; cursor:pointer; }
  .check input { margin:1px 0 0; flex:none; }
  .rangewarn {
    font-size:10px; line-height:1.45; margin-top:7px;
    background:#fff6e0; border-left:3px solid #e0a800;
    color:#6b4f00; padding:6px 8px; border-radius:4px;
  }
  .stats { font-size:11px; color:#555; background:#f6f6f6; border-radius:6px; padding:7px 9px; margin-top:10px; line-height:1.6; }
  .warn { color:#b3261e; font-weight:600; }
  .note { font-size:10px; color:#999; line-height:1.5; margin: 4px 0 0; }
</style>
</head>
<body>
  <h1>Session Keeper</h1>
  <p class="sub">Stops idle sign-outs. Never types or reloads your page.</p>

  <div id="cards"></div>

  <p class="note">
    Timing is randomised inside the range you pick, so requests never arrive on a
    predictable cadence. Neither site's hard token expiry can be beaten — expect
    to still sign in roughly once a day.
  </p>

  <script src="sites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
